<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!--Incluyo CSS para maqueta de cajas-->
  <style>
    * {
      box-sizing: border-box;
      border: solid 1px black;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
    }

    .caja1 {
      background-color: #ACD1F2;
      height: 200px;
    }

    .caja2 {
      background-color: #95c4f7;
      height: 200px;
    }

    .caja3 {
      background-color: #8195A6;
      height: 200px;
    }

    .caja4 {
      background-color: #6c8aa3;
      height: 200px;
    }

    .caja5 {
      background-color: #B4C8D9;
      height: 200px;
    }

    .caja6 {
      background-color: #91b2cf;
      height: 200px;
    }

    .caja7 {
      background-color: #3D5E73;
      height: 200px;
    }

    .caja8 {
      background-color: #345d77;
      height: 200px;
    }

    .caja9 {
      background-color: #D8EEFE;
      height: 200px;
    }

    .caja10 {
      background-color: #a8dbff;
      height: 200px;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-12 col-xxl-12 caja1">caja 1</div>
      <div class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-3 col-xxl-3 caja2">caja 2</div>
      <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-3 col-xxl-3 caja3">caja 3</div>
      <div class="col-6 col-sm-6 col-md-6 col-lg-6 col-xl-3 col-xxl-3 caja4">caja 4</div>
      <div class="col-6 col-sm-6 col-md-6 col-lg-6 col-xl-3 col-xxl-3 caja5">caja 5</div>
      <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-12 col-xxl-12 caja6">caja 6</div>
      <div class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-3 col-xxl-3 caja7">caja 7</div>
      <div class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-3 col-xxl-3 caja8">caja 8</div>
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-3 col-xxl-3 caja9">caja 9</div>
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-3 col-xxl-3 caja10">caja 10</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
